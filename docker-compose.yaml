# Full local stack: NATS + Consul + 3 mpcium nodes + backend API + UI.
# Bring it all up and just open the web:
#
#   docker compose up --build -d
#   open http://localhost:8080
#
# mpcium runs from the official fystacklabs/mpcium image (WORKDIR /app). Each
# node mounts its existing identity + peers.json (from ./mpcium/nodeN) and gets
# a fresh named volume for its BadgerDB shares. Consul + NATS are seeded on
# node startup via --peers.
name: stellar-wallet

# Cap container logs: 3 rotated files x 10 MB per service (~30 MB max).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Only the UI (127.0.0.1:8080) publishes a port, loopback-only. Everything else talks over the compose
  # network; the mpcium nodes bind loopback-only for local debugging. Use
  # `docker compose exec <svc>` to reach consul / nats / backend directly.
  consul:
    logging: *default-logging
    image: consul:1.15.4
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"
    healthcheck:
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    logging: *default-logging
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  node0:
    logging: *default-logging
    image: docker.io/fystacklabs/mpcium:0.3.5
    user: "0:0"
    command: ["start", "-n", "node0", "--peers", "/app/peers.json"]
    volumes:
      - ./infra/mpcium.docker.yaml:/app/config.yaml:ro
      - ./mpcium/node0/identity:/app/identity:ro
      - ./mpcium/node0/peers.json:/app/peers.json:ro
      - node0_db:/app/db
      - node0_backups:/app/backups
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      consul: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: unless-stopped

  node1:
    logging: *default-logging
    image: docker.io/fystacklabs/mpcium:0.3.5
    user: "0:0"
    command: ["start", "-n", "node1", "--peers", "/app/peers.json"]
    volumes:
      - ./infra/mpcium.docker.yaml:/app/config.yaml:ro
      - ./mpcium/node1/identity:/app/identity:ro
      - ./mpcium/node1/peers.json:/app/peers.json:ro
      - node1_db:/app/db
      - node1_backups:/app/backups
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      consul: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: unless-stopped

  node2:
    logging: *default-logging
    image: docker.io/fystacklabs/mpcium:0.3.5
    user: "0:0"
    command: ["start", "-n", "node2", "--peers", "/app/peers.json"]
    volumes:
      - ./infra/mpcium.docker.yaml:/app/config.yaml:ro
      - ./mpcium/node2/identity:/app/identity:ro
      - ./mpcium/node2/peers.json:/app/peers.json:ro
      - node2_db:/app/db
      - node2_backups:/app/backups
    ports:
      - "127.0.0.1:8093:8080"
    depends_on:
      consul: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: unless-stopped

  backend:
    logging: *default-logging
    build:
      context: ./backend
    volumes:
      - ./backend/config.docker.yaml:/app/config.yaml:ro
      - ./mpcium/event_initiator.key:/run/secrets/event_initiator.key:ro
      - backend_data:/data
    depends_on:
      - node0
      - node1
      - node2
    # Runtime hardening: non-root comes from the image; only /data is writable.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  ui:
    logging: *default-logging
    build:
      context: ./ui
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # nginx scratch dirs (temp files, pid) since the root fs is read-only.
    tmpfs:
      - /tmp
      - /run
      - /var/lib/nginx/tmp

volumes:
  node0_db:
  node0_backups:
  node1_db:
  node1_backups:
  node2_db:
  node2_backups:
  backend_data:
