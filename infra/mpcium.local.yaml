# mpcium node config for docker-compose.infra.yaml: nodes use the compose NATS/Consul.
nats:
  url: nats://nats:4222
consul:
  address: consul:8500
mpc_threshold: 2
environment: development
badger_password: "65e720b32a1b3780178aa883"
event_initiator_algorithm: "ed25519"
event_initiator_pubkey: "21f14ab843cb71647100020cd8a5a51a82c3e1f55280bd0f8d734aca4244ac0a"
chain_code: "13ddc491b3dcda986ece9cf777efd0b627d7f190f1349eaf427fda37e19aa723"
db_path: "/app/db"
backup_enabled: true
backup_period_seconds: 300
backup_dir: "/app/backups"
max_concurrent_keygen: 2
max_concurrent_signing: 10
healthcheck:
  enabled: true
  # Same port inside every container; compose maps them to 8091/8092/8093 on
  # the host. The backend reaches them by service name (node_health_url).
  address: "0.0.0.0:8080"
