# Local NATS + Consul for a self-contained MPC dev cluster.
# Used by start.sh when no shared cluster is reachable.
services:
  nats-server:
    image: nats:latest
    container_name: swallet-nats
    command: -js --http_port 8222
    ports:
      - "${NATS_PORT:-4222}:4222"
    restart: always

  consul:
    image: hashicorp/consul:1.15.4
    container_name: swallet-consul
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "${CONSUL_PORT:-8500}:8500"
    restart: always
