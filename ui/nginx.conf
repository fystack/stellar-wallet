server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA (hash routing) — always serve index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API → backend. SSE stream needs buffering off + long read timeout.
  location /api/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /health {
    proxy_pass http://backend:8090/health;
  }
}
